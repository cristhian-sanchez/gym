<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymControl · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ebee;--sf:#fff;--ink:#16202c;--mut:#5d6877;--ln:#d3d8de;--ac:#2446e0;--ai:#fff;--ok:#12803f;--ob:#d8f2e2;--no:#c23030;--nb:#fbdada;--wa:#8a5200;--wb:#fdecc8}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--sf:#18202a;--ink:#e8ecf1;--mut:#9aa6b4;--ln:#2a3542;--ac:#7f9bff;--ai:#0f141b;--ok:#52d58a;--ob:#16382a;--no:#ff8080;--nb:#43201f;--wa:#f0b64a;--wb:#41300e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;font-weight:700}h1{font-size:34px;margin-bottom:18px}h2{font-size:22px;margin-bottom:10px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font:700 26px 'Barlow Condensed',sans-serif;padding:0 8px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:500 16px Barlow,sans-serif;padding:11px 12px;border-radius:8px;cursor:pointer}nav button.on{background:var(--ac);color:var(--ai)}
main{padding:26px;max-width:1000px;width:100%}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px}.big{font:700 44px/1 'Barlow Condensed',sans-serif}.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.badge{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}.ok{background:var(--ob);color:var(--ok)}.no{background:var(--nb);color:var(--no)}.wa{background:var(--wb);color:var(--wa)}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow,sans-serif;cursor:pointer}.btn.s{background:none;color:var(--ink);border:1px solid var(--ln)}.btn.sm{padding:5px 11px;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Barlow,sans-serif;margin:4px 0 10px}label{font-size:14px;color:var(--mut)}
.qr{display:block;margin:10px auto;width:240px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}.poster{text-align:center}
.bar{display:none}[hidden]{display:none!important}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{display:none}main{padding:16px 14px 90px}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px}.bar button{flex:1;background:none;border:0;color:var(--mut);font:600 13px Barlow,sans-serif;padding:10px 2px}.bar button.on{color:var(--ac)}}
@media print{aside,.bar,.card:not(.poster),h1{display:none!important}.app{display:block}}
</style></head>
<body>
<section id="login" class="card" style="max-width:380px;margin:60px auto"><h1>GymControl</h1><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" id="in" style="width:100%">Entrar</button><p id="err" style="color:var(--no)"></p></section>
<div class="app" id="app" hidden><aside><div class="brand">GymControl</div><nav id="nav"></nav><button class="btn s sm" id="out" style="margin-top:20px">Cerrar sesión</button></aside><main id="main"></main><div class="bar" id="bar"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import {auth,db,signInWithEmailAndPassword,onAuthStateChanged,signOut,collection,doc,setDoc,onSnapshot,query,orderBy,limit,Timestamp} from './firebase-config.js';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>'$'+n.toLocaleString('es-CO');
const P={'Día':[1,8000],Quincenal:[15,50000],Mensual:[30,90000],Trimestral:[90,240000]};
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d},dd=m=>Math.round((m.end-t0())/864e5);
const bd=m=>{const d=dd(m);return d<0?'<span class="badge no">Vencida</span>':d<=7?'<span class="badge wa">Por vencer</span>':'<span class="badge ok">Vigente</span>'};
const fd=d=>d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}),ft=d=>d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const opts=()=>Object.keys(P).map(k=>`<option value="${k}" ${k==='Mensual'?'selected':''}>${k} · ${money(P[k][1])}</option>`).join('');
let M={},A=[],PY=[],cur='panel',un=[];
async function charge(ced,name,tel,plan){const o=M[ced],e=new Date(Math.max(o?o.end:0,t0()));e.setDate(e.getDate()+P[plan][0]);
 await setDoc(doc(db,'members',ced),{name,tel,plan,end:Timestamp.fromDate(e)});
 await setDoc(doc(db,'payments',crypto.randomUUID()),{cedula:ced,name,plan,amt:P[plan][1],at:Timestamp.now()})}
const V={
panel:()=>`<h1>Resumen del gimnasio</h1><div class="grid g4"><div class="card"><div class="big" id="s1"></div><div class="mut">Socios con membresía vigente</div></div><div class="card"><div class="big" id="s2"></div><div class="mut">Ingresos del mes</div></div><div class="card"><div class="big" id="s3"></div><div class="mut">Entradas de hoy</div></div><div class="card"><div class="big" id="s4"></div><div class="mut">Vencen en 7 días</div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Por vencer</h2><div id="soon"></div></div><div class="card"><h2>Últimas entradas</h2><div id="lastin"></div></div></div>`,
socios:()=>`<h1>Socios</h1><div class="card"><label for="sq">Buscar</label><input id="sq" placeholder="Nombre, cédula o teléfono"><div id="ml"></div></div>
<details class="card" style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Nuevo socio</summary><div style="margin-top:10px"><label for="nc">Cédula</label><input id="nc" inputmode="numeric"><label for="nn">Nombre completo</label><input id="nn"><label for="nt">Teléfono</label><input id="nt" inputmode="tel"><label for="np">Plan</label><select id="np">${opts()}</select><button class="btn" id="sv">Registrar y cobrar</button><p class="mut" id="se"></p></div></details>`,
pagos:()=>`<h1>Pagos</h1><div class="grid g2"><div class="card"><h2>Registrar pago</h2><label for="pm">Socio</label><select id="pm"></select><label for="pp">Plan</label><select id="pp">${opts()}</select><button class="btn" id="pg">Cobrar y renovar</button><p class="mut" id="pe"></p></div><div class="card"><h2>Pagos recientes</h2><div id="pl"></div></div></div>`,
cartel:()=>`<h1>Cartel QR</h1><div class="grid g2"><div class="card poster"><h2 style="font-size:36px">Registra tu asistencia</h2><img class="qr" id="qr" alt="QR de registro"><p style="text-align:left;display:inline-block"><strong>1.</strong> Escanea el código con la cámara del celular<br><strong>2.</strong> Escribe tu número de cédula<br><strong>3.</strong> Listo, a entrenar</p></div><div class="card"><h2>Cómo funciona</h2><p>Imprime el cartel una sola vez y pégalo en la entrada. Todos los socios usan el mismo QR y el sistema valida la membresía con la cédula.</p><p class="mut" id="url" style="word-break:break-all"></p><button class="btn" onclick="window.print()">Imprimir cartel</button></div></div>`};
function fill(){const tz=t0(),now=new Date(),L=Object.entries(M).map(([id,m])=>({id,...m})),set=(i,h)=>{const e=$('#'+i);if(e)e.innerHTML=h};
 const td=A.filter(a=>a.at.toDate()>=tz),soon=L.filter(m=>{const d=dd(m);return d>=0&&d<=7}).sort((a,b)=>a.end-b.end);
 set('s1',L.filter(m=>dd(m)>=0).length);set('s2',money(PY.filter(p=>{const d=p.at.toDate();return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).reduce((s,p)=>s+p.amt,0)));set('s3',td.length);set('s4',soon.length);
 set('soon',soon.map(m=>`<div class="row"><div>${esc(m.name)}<div class="mut">${dd(m)===0?'Vence hoy':'Vence en '+dd(m)+' días'}</div></div><button class="btn sm" data-r="${esc(m.id)}">Renovar</button></div>`).join('')||'<p class="mut">Nadie vence esta semana.</p>');
 set('lastin',td.slice(0,6).map(a=>`<div class="row"><span>${esc(a.name)}</span><span class="mut">${ft(a.at.toDate())} ${a.ok?'✔':'· vencida'}</span></div>`).join('')||'<p class="mut">Aún no hay entradas hoy.</p>');
 const q=($('#sq')?$('#sq').value:'').toLowerCase();
 set('ml',L.filter(m=>(m.name+m.id+(m.tel||'')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<div class="row"><div>${esc(m.name)}<div class="mut">CC ${esc(m.id)} · ${esc(m.tel||'')} · ${m.plan} · vence ${fd(m.end)}</div></div><div style="display:flex;gap:8px;align-items:center">${bd(m)}<button class="btn s sm" data-r="${esc(m.id)}">Renovar</button></div></div>`).join('')||'<p class="mut">Sin resultados.</p>');
 const pm=$('#pm');if(pm&&pm.options.length!==L.length)pm.innerHTML=L.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
 set('pl',PY.slice(0,10).map(p=>`<div class="row"><div>${esc(p.name)}<div class="mut">${p.plan} · ${fd(p.at.toDate())}</div></div><strong>${money(p.amt)}</strong></div>`).join('')||'<p class="mut">Aún no hay pagos.</p>')}
const N=[['panel','Panel'],['socios','Socios'],['pagos','Pagos'],['cartel','Cartel QR']];
$('#nav').innerHTML=N.map(n=>`<button data-v="${n[0]}">${n[1]}</button>`).join('');$('#bar').innerHTML=$('#nav').innerHTML;
function go(v){cur=v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#main').innerHTML=V[v]();
 if(v==='cartel'){const q=qrcode(0,'M'),u=new URL('registro.html',location.href).href;q.addData(u);q.make();$('#qr').src=q.createDataURL(8,2);$('#url').textContent=u}fill()}
document.addEventListener('click',async e=>{const t=e.target,v=t.closest('[data-v]'),r=t.closest('[data-r]');
 if(v)return go(v.dataset.v);
 if(r){const m=M[r.dataset.r];return charge(r.dataset.r,m.name,m.tel||'',m.plan)}
 if(t.id==='sv'){const c=$('#nc').value.replace(/\D/g,''),n=$('#nn').value.trim();if(!c||!n)return $('#se').textContent='Escribe la cédula y el nombre.';
  await charge(c,n,$('#nt').value.trim(),$('#np').value);go('socios')}
 if(t.id==='pg'){const c=$('#pm').value;if(!c)return $('#pe').textContent='Primero registra un socio.';const m=M[c];await charge(c,m.name,m.tel||'',$('#pp').value);$('#pe').textContent='Pago registrado. '+m.name+' queda activo.'}});
document.addEventListener('input',e=>{if(e.target.id==='sq')fill()});
$('#in').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value).catch(()=>$('#err').textContent='Correo o contraseña incorrectos');
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('#login').hidden=!!u;$('#app').hidden=!u;un.forEach(f=>f());un=[];if(!u)return;
 un.push(onSnapshot(collection(db,'members'),s=>{M={};s.docs.forEach(d=>{const x=d.data();M[d.id]={...x,end:x.end.toDate()}});fill()}));
 un.push(onSnapshot(query(collection(db,'attendance'),orderBy('at','desc'),limit(100)),s=>{A=s.docs.map(d=>d.data()).filter(a=>a.at);fill()}));
 un.push(onSnapshot(query(collection(db,'payments'),orderBy('at','desc'),limit(100)),s=>{PY=s.docs.map(d=>d.data()).filter(p=>p.at);fill()}));go(cur)});
</script></body></html>
