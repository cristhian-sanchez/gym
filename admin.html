<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymControl · Panel</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#10151c;color:#e8ecf1}main{max-width:980px;margin:auto;padding:20px}h1,h2{margin:0 0 10px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.c{background:#18202a;border:1px solid #2a3542;border-radius:10px;padding:16px;margin-bottom:14px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #2a3542;background:#10151c;color:inherit;font-size:16px;width:100%;margin:4px 0 8px}button{background:#7f9bff;color:#10151c;font-weight:700;border:0;cursor:pointer}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2a3542}.r button{width:auto;margin:0;padding:5px 10px}.m{color:#9aa6b4;font-size:14px}.ok{color:#52d58a}.no{color:#ff8080}.wa{color:#f0b64a}
#qr{display:block;margin:auto;width:220px;background:#fff;padding:8px;border-radius:8px}[hidden]{display:none!important}</style></head>
<body><main>
<section id="login" class="c" style="max-width:380px;margin:60px auto"><h1>GymControl</h1><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="in">Entrar</button><p id="err" class="no"></p></section>
<section id="app" hidden><div class="r"><h1>Panel del gimnasio</h1><button id="out">Salir</button></div>
<div class="g"><div><div class="c"><h2>Entradas de hoy: <span id="n">0</span></h2><div id="at"></div></div>
<div class="c"><h2>Cartel QR</h2><img id="qr" alt="QR de registro"><p class="m" id="url" style="word-break:break-all;text-align:center"></p><button onclick="window.print()">Imprimir cartel</button></div></div>
<div><div class="c"><h2>Nuevo socio o renovación</h2><input id="nc" inputmode="numeric" placeholder="Cédula"><input id="nn" placeholder="Nombre completo"><select id="np"><option>Día</option><option>Quincenal</option><option selected>Mensual</option><option>Trimestral</option></select><button id="sv">Guardar y activar plan</button></div>
<div class="c"><h2>Socios</h2><div id="ms"></div></div></div></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import {auth,db,signInWithEmailAndPassword,onAuthStateChanged,signOut,collection,doc,setDoc,onSnapshot,query,orderBy,limit,Timestamp} from './firebase-config.js';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={'Día':1,Quincenal:15,Mensual:30,Trimestral:90},M={};
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const plus=(b,n)=>{const d=new Date(b);d.setDate(d.getDate()+n);return Timestamp.fromDate(d)};
const save=(ced,name,plan,base)=>setDoc(doc(db,'members',ced),{name,plan,end:plus(base,P[plan])});
$('#in').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value).catch(()=>$('#err').textContent='Correo o contraseña incorrectos');
$('#out').onclick=()=>signOut(auth);
$('#sv').onclick=async()=>{const c=$('#nc').value.replace(/\D/g,''),n=$('#nn').value.trim();if(!c||!n)return;const o=M[c],b=o?new Date(Math.max(o.end,t0())):t0();await save(c,n,$('#np').value,b);$('#nc').value=$('#nn').value=''};
$('#ms').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=M[b.dataset.c];save(b.dataset.c,m.name,m.plan,new Date(Math.max(m.end,t0())))};
let un=[];
onAuthStateChanged(auth,u=>{$('#login').hidden=!!u;$('#app').hidden=!u;un.forEach(f=>f());un=[];if(!u)return;
 const q=qrcode(0,'M'),url=new URL('registro.html',location.href).href;q.addData(url);q.make();$('#qr').src=q.createDataURL(8,2);$('#url').textContent=url;
 un.push(onSnapshot(query(collection(db,'attendance'),orderBy('at','desc'),limit(30)),s=>{const L=s.docs.map(d=>d.data()).filter(a=>a.at&&a.at.toDate()>=t0());$('#n').textContent=L.length;
  $('#at').innerHTML=L.map(a=>`<div class="r"><span>${esc(a.name)}</span><span class="${a.ok?'ok':'no'}">${a.at.toDate().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})} ${a.ok?'✔':'vencida'}</span></div>`).join('')||'<p class="m">Aún no hay entradas.</p>'}));
 un.push(onSnapshot(collection(db,'members'),s=>{s.docs.forEach(d=>M[d.id]={...d.data(),end:d.data().end.toDate()});
  $('#ms').innerHTML=s.docs.map(d=>{const m=M[d.id],k=Math.round((m.end-t0())/864e5);return `<div class="r"><div>${esc(m.name)}<div class="m">CC ${esc(d.id)} · ${m.plan} · ${k<0?'<span class="no">vencida</span>':k<=7?`<span class="wa">vence en ${k} d</span>`:`<span class="ok">vigente (${k} d)</span>`}</div></div><button data-c="${esc(d.id)}">Renovar</button></div>`}).join('')||'<p class="m">Registra tu primer socio.</p>'}))});
</script></body></html>
