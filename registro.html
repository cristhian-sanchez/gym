<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de asistencia</title>
<style>body{margin:0;font:17px system-ui,sans-serif;background:#10151c;color:#e8ecf1;display:grid;place-items:center;min-height:100vh}main{width:min(92vw,380px)}
h1{font-size:30px;margin:0 0 16px}label{color:#9aa6b4;font-size:14px}input,button{width:100%;padding:14px;border-radius:10px;border:0;font-size:18px;margin:6px 0 12px}
input{background:#18202a;color:inherit;border:1px solid #2a3542}button{background:#7f9bff;color:#10151c;font-weight:700}
#r{border-radius:12px;padding:20px;text-align:center;display:none}#r b{display:block;font-size:28px;margin-bottom:4px}.ok{background:#16382a;color:#52d58a}.no{background:#43201f;color:#ff8080}.wa{background:#41300e;color:#f0b64a}</style></head>
<body><main><h1>¿Vas a entrenar hoy?</h1><label for="c">Número de cédula</label><input id="c" inputmode="numeric" autocomplete="off"><button id="b">Registrar asistencia</button><div id="r"></div></main>
<script type="module">
import {db,doc,getDoc,setDoc,serverTimestamp} from './firebase-config.js';
const $=s=>document.querySelector(s);
const show=(k,t,d='')=>{const r=$('#r');r.className=k;r.style.display='block';r.innerHTML=`<b>${t}</b>${d}`};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const F=['Lo difícil ya lo hiciste: llegar. Ahora a entrenar.','Cada repetición cuenta, aunque hoy no se sienta así.','No tienes que ser perfecto, solo constante.','Tu yo de dentro de un mes te va a agradecer este día.','La disciplina gana cuando la motivación se va.','Un día más es un día menos para lograrlo.','Hoy suma, aunque sea poco. Lo importante es no parar.','Entrenar sin ganas es lo que marca la diferencia.','Los pequeños esfuerzos repetidos hacen grandes cambios.','Tu cuerpo aguanta más de lo que tu mente cree.'];
const MS={3:'¡3 días de racha! Ya se está formando el hábito.',7:'¡Una semana de racha! Eso es constancia de verdad.',14:'¡Dos semanas sin soltar! Vas muy en serio.',30:'¡30 días de racha! Esto ya es parte de tu vida.',60:'¡60 días! Eres un ejemplo para los demás.',100:'¡100 días de racha! Leyenda del gimnasio.'};
const phrase=n=>MS[n]||F[Math.floor(Date.now()/864e5)%F.length];
const fire=n=>`<span style="display:block;margin-top:12px;font-size:20px">🔥 ${n===1?'Empiezas tu racha: 1 día':'Llevas <strong>'+n+'</strong> días de racha'}</span><span style="display:block;margin-top:6px;font-size:15px">${phrase(n)}</span>`;
async function streak(ced,name){const t=new Date();t.setHours(0,0,0,0);const today=ds(t),ref=doc(db,'streaks',ced);let cur=null;
 try{const s=await getDoc(ref);if(s.exists())cur=s.data()}catch(e){}
 if(cur&&cur.last===today)return cur.count;
 const gap=cur?Math.round((t-new Date(cur.last+'T00:00:00'))/864e5):99,count=cur&&gap<=2?cur.count+1:1;
 await setDoc(ref,{name,last:today,count,best:Math.max(count,cur?cur.best||0:0)});return count}
$('#b').onclick=async()=>{const ced=$('#c').value.replace(/\D/g,'');if(!ced)return show('no','Escribe tu cédula');
 try{const s=await getDoc(doc(db,'members',ced));if(!s.exists())return show('no','Cédula no encontrada','Pregunta en recepción');
  const m=s.data(),t=new Date();t.setHours(0,0,0,0);const days=Math.round((m.end.toDate()-t)/864e5),ok=days>=0;let dup=false;
  try{await setDoc(doc(db,'attendance',ced+'_'+Math.floor(Date.now()/3e5)),{cedula:ced,name:m.name,ok,at:serverTimestamp()})}catch(e){dup=true}
  let n=0;if(ok){try{n=await streak(ced,m.name)}catch(e){}}
  const x=n?fire(n):'';
  if(dup)return show('wa','Ya registraste tu entrada','Hace pocos minutos'+x);
  ok?show('ok','Puede entrar',`${m.name} · ${days===0?'tu plan vence hoy':'te quedan '+days+' días'}${x}`):show('no','Membresía vencida',`${m.name}, renueva tu plan en recepción`)}
 catch(e){show('no','No se pudo registrar','Revisa tu conexión e intenta de nuevo')}};
</script></body></html>
